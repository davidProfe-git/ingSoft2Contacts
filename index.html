<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarjeta de Presentación</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 350px;
      width: 100%;
    }

    .card h1 {
      margin-top: 0;
      font-size: 24px;
      color: #333;
    }

    .info {
      margin-top: 20px;
    }

    .info p {
      margin: 10px 0;
      font-size: 16px;
      color: #555;
    }

    .info p span {
      font-weight: bold;
      color: #222;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Jhosef Molina</h1>
    <div class="info">
      <p><span>Teléfono:</span> +57 324 564 76 87</p>
      <p><span>Correo:</span> jhosef.molina@email.com</p>
    </div>
  </div>

</body>
</html>
