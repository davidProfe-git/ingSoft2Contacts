<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tarjeta de Presentación</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 30px;
      text-align: center;
      width: 300px;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 22px;
      margin: 10px 0;
    }

    .contact-info {
      color: #555;
      margin: 5px 0;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #0077cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg" alt="Cristiano Ronaldo" class="profile-img" />
    <h1>Alisson Sofía Espitia</h1>
    <p class="contact-info">📧 alisson.sofia@email.com</p>
    <p class="contact-info">📞 +57 301 234 5678</p>
    <button onclick="showMessage()">Ver mensaje</button>
  </div>

  <script>
    function showMessage() {
      alert("¡Hola! Esta es la tarjeta de presentación de Alisson Sofía Espitia.");
    }
  </script>
</body>
</html>
