<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Minimalista</title>
  <style>
    /* Paleta oscura */
    body {
      font-family: Arial, sans-serif;
      background-color: #0e0e0e;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 1rem;
      background: #1a1a1a;
      text-align: center;
      color: #b78cff;
      font-size: 1.5rem;
      font-weight: bold;
      border-bottom: 1px solid #2a2a2a;
    }

    main {
      width: 100%;
      max-width: 800px;
      padding: 2rem;
    }

    section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    h2 {
      color: #b78cff;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input {
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
    }

    input:focus {
      outline: 1px solid #b78cff;
    }

    button {
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      background: #b78cff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #9d6be6;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2a2a2a;
      padding: 0.8rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .actions button {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      border-radius: 4px;
    }

    .edit {
      background: #6c63ff;
    }

    .delete {
      background: #e64571;
    }

    .edit:hover {
      background: #5750cc;
    }

    .delete:hover {
      background: #c5305a;
    }
  </style>
</head>
<body>
  <header>CRUD Minimalista</header>
  <main>
    <!-- Crear -->
    <section>
      <h2>Agregar Contacto</h2>
      <form>
        <input type="text" placeholder="Nombre" required>
        <input type="email" placeholder="Correo" required>
        <button type="submit">Agregar</button>
      </form>
    </section>

    <!-- Leer (Listado) -->
    <section>
      <h2>Contactos</h2>
      <ul>
        <li>
          <span>Santiago - santiago@mail.com</span>
          <div class="actions">
            <button class="edit">Editar</button>
            <button class="delete">Eliminar</button>
          </div>
        </li>
        <li>
          <span>Ana - ana@mail.com</span>
          <div class="actions">
            <button class="edit">Editar</button>
            <button class="delete">Eliminar</button>
          </div>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
