<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Contactos </title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <header> Registro de Contactos</header>
  <main>

    <section>
      <h2 id="form-title">Agregar Nuevo Contacto</h2>
      <form id="contact-form">
        <input type="text" id="name-input" placeholder="Nombre completo" required>
        <input type="email" id="email-input" placeholder="Correo electrónico" required>
        <input type="tel" id="phone-input" placeholder="Número de teléfono" required>
        <button type="submit" id="form-button">Agregar Contacto</button>
      </form>
    </section>


    <section>
      <h2>Lista de Contactos</h2>
      <div class="contact-count" id="contact-count">0 contactos registrados</div>
      <div id="contacts-container">
        <div class="empty-state">
          No hay contactos registrados aún.<br>
          ¡Agrega tu primer contacto usando el formulario de arriba!
        </div>
      </div>
    </section>
  </main>


  <script src="script.js"></script>
</body>
</html>
